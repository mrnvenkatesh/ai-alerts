name: Daily GenAI Intelligence Briefing

on:
  schedule:
    # 00:23 UTC = 05:53 AM IST (Offsets from peak :30 mark to avoid GitHub runner queue delays)
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (do not send email)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Briefing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TIMEZONE: 'Asia/Kolkata'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/scheduler.py --now --dry-run
          else
            python src/scheduler.py --now
          fi

      - name: Upload Briefing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-output
          path: output/
          retention-days: 7
